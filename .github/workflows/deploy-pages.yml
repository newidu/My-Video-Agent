name: Deploy My Video Agent website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p _site/ui
          cp ui/index.html _site/ui/index.html
          cp -R ui/styles _site/ui/styles
          cp -R ui/redesign _site/ui/redesign
          cp -R src _site/src
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./ui/">
            <title>My Video Agent</title>
            <script>location.replace(new URL('./ui/', location.href).href);</script>
          </head>
          <body><p>Opening <a href="./ui/">My Video Agent</a>…</p></body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
